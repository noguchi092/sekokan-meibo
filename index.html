<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="従業員名簿 by セコカン台帳。現在は一般登録の受付を停止しています。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>ログイン｜従業員名簿 by セコカン台帳</title>
<style>
:root{--ink:#17304f;--teal:#008e83;--line:#e1e8ef}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Meiryo",sans-serif;background:#f4f7fb}header{padding:22px 32px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:25px;font-weight:800;line-height:1.4}.brand small{display:block;font-size:12px;letter-spacing:1px;color:#718398}.mark{color:var(--teal);margin-right:8px}.badge{padding:5px 12px;border-radius:6px;background:#e2f5ef;color:#00776e;font-size:13px;white-space:nowrap}main{width:min(100% - 32px,480px);margin:64px auto 32px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px;box-shadow:0 10px 32px #17304f08}.lock{display:grid;place-items:center;margin-bottom:20px;width:54px;height:54px;border-radius:14px;background:#e5f5f1;color:var(--teal)}h1{font-size:26px;margin:0 0 8px;line-height:1.4}p{margin:8px 0}.muted{font-size:14px;color:#718096}.notice{padding:14px 16px;background:#fff7ec;border:1px solid #f5d1ab;border-radius:8px;color:#9d5717;font-size:14px;margin:24px 0}label{display:block;font-size:14px;font-weight:600;margin:18px 0 0}input,button{font:inherit;width:100%;border-radius:7px}input{display:block;padding:11px 12px;margin-top:6px;border:1px solid #d6dfe8;background:#f5f7fa;color:#6d7b8b}button{padding:12px;border:0;margin-top:24px;font-weight:700}button:disabled{cursor:not-allowed}.login{background:#dce9e8;color:#537874}.registration{border-top:1px solid var(--line);margin-top:28px;padding-top:22px;text-align:center}.registration button{margin-top:12px;background:#eef1f5;color:#7b8796;border:1px solid var(--line)}footer{text-align:center;font-size:12px;color:#7c899b;margin-top:24px}@media(max-width:600px){header{padding:18px 16px}.brand{font-size:22px}.badge{font-size:11px}main{margin-top:32px}.card{padding:26px 22px}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">▧</span>従業員名簿<small>by セコカン台帳</small></div><span class="badge">試験公開</span></header>
<main>
<section class="card" aria-labelledby="login-title">
<div class="lock" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div>
<h1 id="login-title">管理者ログイン</h1>
<p class="muted">現在は一般公開に向けた準備中です。</p>
<div class="notice" role="status"><strong>一般登録の受付は停止しています。</strong><br>管理者ログインも現在準備中です。認証の設定が完了するまで、名簿の登録・操作はできません。</div>
<fieldset disabled style="border:0;padding:0;margin:0"><legend style="position:absolute;width:1px;height:1px;overflow:hidden">管理者ログイン（準備中）</legend>
<label for="email">メールアドレス<input id="email" type="email" autocomplete="off" placeholder="認証設定後に利用できます" disabled></label>
<label for="password">パスワード<input id="password" type="password" autocomplete="off" placeholder="現在は入力できません" disabled></label>
<button class="login" type="button" disabled>ログイン（準備中）</button>
</fieldset>
<div class="registration"><p class="muted">新しい会社の登録をご希望の方へ</p><button type="button" disabled>新規登録（受付停止中）</button><p class="muted">受付開始までお待ちください。</p></div>
</section>
<footer>従業員名簿 by セコカン台帳</footer>
</main>
</body>
</html>
