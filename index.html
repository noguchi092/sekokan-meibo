<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="従業員名簿 by セコカン台帳。施工業者向け無料ツールの開発プレビュー。">
<title>従業員名簿 by セコカン台帳</title>
<style>
:root{--ink:#17304f;--teal:#008e83;--bg:#f4f7fb;--line:#e1e8ef}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Meiryo",sans-serif;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f6a347;outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 32px;background:white;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:800}.brand small{display:block;font-size:12px;letter-spacing:1px;color:#718398}.brand-mark{color:var(--teal);margin-right:8px}.pill{padding:5px 12px;border-radius:6px;background:#dff5ef;color:#007e71;font-size:13px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 92px)}nav{padding:28px 16px;background:white;border-right:1px solid var(--line)}nav button{display:block;width:100%;padding:14px 18px;text-align:left;border:0;background:none;color:var(--ink);border-radius:7px;margin-bottom:8px}nav button.active{background:#e4f1ff;color:#1260a9;font-weight:700}.nav-note{font-size:12px;color:#728095;padding:20px 16px}main{padding:32px;max-width:1500px;width:100%}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:32px;line-height:1.3;margin:0 0 10px}h2{font-size:20px;margin:0 0 16px}p{margin:8px 0}.muted{color:#718096;font-size:14px}.btn{border:1px solid var(--line);padding:11px 18px;border-radius:7px;color:var(--ink);background:white}.primary{background:var(--teal);border-color:var(--teal);color:white}.actions{display:flex;gap:10px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:24px}.metric{display:flex;gap:20px;align-items:center}.metric strong{display:block;font-size:36px;line-height:1.4}.icon{display:grid;place-items:center;font-size:23px;color:#1260a9;background:#e8f2ff;border-radius:50%;width:54px;height:54px}.notice{border:1px solid #f5d1ab;background:#fff7ec;border-radius:9px;padding:16px 22px;color:#9d5717;margin-bottom:22px}.columns{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}.site{border:1px solid var(--line);padding:20px;border-radius:8px;margin:14px 0}.site h3{font-size:19px;margin:0}.status{display:inline-block;border-radius:5px;padding:3px 10px;background:#e1f6f0;color:#00776e;font-size:13px;margin-top:10px}.empty{text-align:center;padding:34px 16px;color:#74849a}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}th{background:#f5f7fa;color:#69778b}td,th{padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.search{width:min(360px,100%);padding:11px 14px;border:1px solid var(--line);border-radius:6px;margin:0 0 20px}label{display:block;margin-bottom:16px;font-size:14px;font-weight:600}label input,label select{display:block;width:100%;margin-top:6px;border:1px solid #cdd7e1;border-radius:6px;padding:10px 12px;color:var(--ink);background:white}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.wide{grid-column:1/-1}dialog{max-width:680px;width:calc(100% - 32px);max-height:90vh;border:0;border-radius:12px;padding:28px;color:var(--ink);box-shadow:0 20px 70px #102e4e30}dialog::backdrop{background:#0d203b66}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog-head h2{margin:0}.close{background:none;border:0;font-size:24px}.check{display:flex;gap:10px;align-items:center}.check input{width:auto;margin:0}.preview-banner{background:#eaf3fb;color:#496681;font-size:13px;padding:10px 32px;border-bottom:1px solid var(--line)}.toast{position:fixed;right:24px;bottom:24px;background:#193653;color:white;padding:15px 22px;border-radius:9px;z-index:5}.hidden{display:none}.steps{display:flex;gap:14px;flex-wrap:wrap}.steps span{padding:10px 15px;background:#f0f5fa;border-radius:6px;font-size:14px}footer{margin-top:28px;color:#7c899b;font-size:12px}.danger{color:#ab3434}.print-only{display:none}@media(max-width:1000px){.columns{grid-template-columns:1fr}.intro{align-items:flex-start;flex-direction:column}.shell{grid-template-columns:180px 1fr}main{padding:24px}.metric{gap:10px}.icon{display:none}}@media(max-width:680px){header{padding:16px}.brand{font-size:22px}.shell{display:block}nav{display:flex;overflow:auto;gap:8px;padding:10px;border-right:0}nav button{width:auto;white-space:nowrap;margin:0;padding:9px 12px}.nav-note{display:none}main{padding:20px 14px}h1{font-size:26px}.metrics{gap:8px}.metric{padding:14px 10px;font-size:12px}.metric strong{font-size:27px}.card{padding:18px}.fields{grid-template-columns:1fr}.preview-banner{padding:10px 16px}.intro .actions{width:100%}}@media print{body{background:white}header,.preview-banner,nav,main,dialog,.toast{display:none!important}.print-only{display:block}table{font-size:11px}h1{font-size:22px}th,td{white-space:normal;padding:7px;border:1px solid #999}@page{size:A4 landscape;margin:15mm}}
</style>
</head><body>
<header><div class="brand"><span class="brand-mark">▧</span>従業員名簿<small>by セコカン台帳</small></div><div><span class="pill">無料ツール</span> <span id="company-label">会社未登録</span></div></header>
<div class="preview-banner">開発プレビュー｜入力内容はこの画面を閉じると消えます。実際の個人情報は入力しないでください。メール認証・共有・送信は未接続です。</div>
<div class="shell"><nav aria-label="メインメニュー" id="nav"></nav><main id="main"></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="close" aria-label="閉じる" id="close">×</button></div><form id="form"></form></dialog>
<section id="print" class="print-only"></section><div id="toast" role="status" class="toast hidden"></div>
<script>
'use strict';
const state={company:null,employees:[],sites:[],history:[],page:'home'};
const pages=[['home','⌂','ホーム'],['company','▦','会社情報'],['employees','♙','従業員名簿'],['qualifications','▤','資格・添付書類'],['sites','▧','提出先現場'],['history','↗','提出履歴']];
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dueEmployees=()=>state.employees.filter(e=>e.healthDue&&e.healthDue<=localDate());
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function employeeTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>氏名</th><th>職種</th><th>資格</th><th>健診確認期限（社内設定）</th><th>操作</th></tr></thead><tbody>${list.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.trade||'—')}</td><td>${esc(e.qualification||'未登録')}</td><td class="${e.healthDue&&e.healthDue<=localDate()?'danger':''}">${esc(e.healthDue||'未設定')}</td><td><button class="btn" data-edit="${esc(e.id)}">編集</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">従業員はまだ登録されていません。<br>「従業員を登録」から始めましょう。</div>'}
function siteCards(){return state.sites.length?state.sites.map(s=>`<article class="site"><h3>${esc(s.name)}</h3><p class="muted">${esc(s.contractor||'元請会社未入力')}</p><span class="status">提出用の下書き</span><p class="muted">実際の現場への連携・送信はまだ行われません。</p><button class="btn" data-site-edit="${esc(s.id)}">現場を編集</button></article>`).join(''):'<div class="empty">提出先現場を登録すると、<br>現場ごとに名簿を作成できます。</div>'}
function render(){
 $('company-label').textContent=state.company?.name||'会社未登録';
 $('nav').innerHTML=pages.map(([id,icon,title])=>`<button data-page="${id}" ${id===state.page?'aria-current="page"':''} class="${id===state.page?'active':''}">${icon}　${title}</button>`).join('')+'<div class="nav-note">一度の登録で、複数の現場へ。<br>無料で使える名簿ツール。</div>';
 let content='';
 if(state.page==='home')content=`<div class="intro"><div><h1>ホーム</h1><p>会社と従業員の情報を、ひとつに。</p><p class="muted">現場ごとの名簿作成・提出を、もっとかんたんに。</p></div><div class="actions"><button class="btn primary" data-action="employee">＋ 従業員を登録</button><button class="btn" data-action="company">会社を登録・編集</button></div></div><div class="metrics"><div class="card metric"><span class="icon">♙</span><div>登録従業員<strong>${state.employees.length}<small> 名</small></strong></div></div><div class="card metric"><span class="icon">▧</span><div>提出先現場<strong>${state.sites.length}<small> 件</small></strong></div></div><div class="card metric"><span class="icon">!</span><div>期限の要確認<strong>${dueEmployees().length}<small> 件</small></strong></div></div></div><div class="notice">${state.company?'登録情報の共有先は、ご自身で選択する設計です。現在は下書き・出力のみ利用できます。':'まずは会社を登録しましょう。メールアドレスと電話番号を入力する画面から始められます。'}</div><div class="columns"><section class="card"><h2>提出先現場</h2><button class="btn" data-action="site">＋ 現場の下書きを追加</button>${siteCards()}</section><section class="card"><h2>登録を進めましょう</h2><div class="steps"><span>① 会社情報 ${state.company?'✓':''}</span><span>② 従業員登録 ${state.employees.length?'✓':''}</span><span>③ 名簿を出力</span></div><p class="muted">資格・健診情報の期限は会社側で設定できます。</p><h2 style="margin-top:28px">従業員の登録状況</h2>${employeeTable(state.employees.slice(0,4))}</section></div>`;
 if(state.page==='company')content=`<div class="intro"><div><h1>会社情報</h1><p class="muted">各現場の名簿で使用する共通情報です。</p></div><button class="btn primary" data-action="company">会社を登録・編集</button></div><section class="card">${state.company?`<h2>${esc(state.company.name)}</h2><p>メール：${esc(state.company.email)}</p><p>電話番号：${esc(state.company.phone)}</p><p>郵便番号：${esc(state.company.postcode)}</p><p>住所：${esc(state.company.address)}</p><p>代表者：${esc(state.company.representative)}</p><p class="muted">メール未認証・アカウント未発行（試作版）</p>`:'<div class="empty">会社情報を登録してください。</div>'}</section>`;
 if(state.page==='employees')content=`<div class="intro"><div><h1>従業員名簿</h1><p class="muted">共通の従業員情報を登録・編集します。</p></div><div class="actions"><button class="btn primary" data-action="employee">＋ 従業員を登録</button><button class="btn" data-action="export">名簿を出力</button></div></div><section class="card"><input class="search" id="search" aria-label="従業員検索" placeholder="氏名・職種・資格で検索"><div id="employees-table">${employeeTable(state.employees)}</div></section>`;
 if(state.page==='qualifications')content=`<div class="intro"><div><h1>資格・添付書類</h1><p class="muted">資格情報と、会社で設定した健診確認期限を管理します。</p></div></div><div class="notice">資格証・免許証・健康診断書などのファイル保存は、本番の認証・権限管理を接続してから追加します。</div><section class="card">${employeeTable(state.employees)}</section>`;
 if(state.page==='sites')content=`<div class="intro"><div><h1>提出先現場</h1><p class="muted">出力先の現場を整理できます。現場の本人確認・オンライン連携は未接続です。</p></div><div class="actions"><button class="btn primary" data-action="site">＋ 現場を追加</button><button class="btn" data-action="export">名簿を出力</button></div></div><section class="card">${siteCards()}</section>`;
 if(state.page==='history')content=`<h1>提出履歴</h1><div class="notice">この画面には出力操作の履歴だけを表示します。提出完了や相手の受領を示すものではありません。</div><section class="card">${state.history.length?`<div class="table-wrap"><table><thead><tr><th>操作日</th><th>現場名</th><th>人数</th><th>操作</th></tr></thead><tbody>${state.history.map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.site)}</td><td>${h.count}名</td><td>${esc(h.type)}（送信なし）</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">出力履歴はありません。</div>'}</section>`;
 $('main').innerHTML=content+'<footer>従業員名簿 by セコカン台帳 ｜ 開発プレビュー・データはメモリ上のみ</footer>';
}
function input(name,title,value='',type='text',required=false){return `<label>${title}${required?' *':''}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="300"></label>`}
function openForm(title,html,onSubmit){$('dialog-title').textContent=title;$('form').innerHTML=html;$('form').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target))};$('dialog').showModal()}
function companyForm(){const c=state.company||{};openForm('会社登録・編集',`<p class="muted">無料登録の入力プレビューです。認証メール送信や会社アカウント作成は行いません。</p><div class="fields">${input('name','会社名',c.name,'text',true)}${input('representative','代表者名',c.representative)}${input('email','メールアドレス',c.email,'email',true)}${input('phone','電話番号',c.phone,'tel',true)}${input('postcode','郵便番号',c.postcode)}${input('address','住所',c.address)}</div><button class="btn primary">会社情報を下書き保存</button>`,data=>{state.company=Object.fromEntries(data);$('dialog').close();render();toast('会社情報の下書きを保存しました（認証・送信なし）')})}
function employeeForm(id){const e=state.employees.find(e=>e.id===id)||{};openForm('従業員登録・編集',`<div class="fields">${input('name','氏名',e.name,'text',true)}${input('kana','ふりがな',e.kana)}${input('trade','職種',e.trade)}${input('birthDate','生年月日',e.birthDate,'date')}${input('qualification','保有資格',e.qualification)}${input('healthDue','健診確認期限（社内設定）',e.healthDue,'date')}</div><p class="muted">試作中のため架空の情報でお試しください。個人情報はこの画面の外へ送信しません。</p><button class="btn primary">下書き保存</button>`,data=>{const saved={...Object.fromEntries(data),id:e.id||crypto.randomUUID()};const i=state.employees.findIndex(x=>x.id===saved.id);if(i<0)state.employees.push(saved);else state.employees[i]=saved;$('dialog').close();render();toast('従業員情報の下書きを保存しました')})}
function siteForm(id){const s=state.sites.find(s=>s.id===id)||{};openForm('提出先現場の下書き',input('name','工事名称',s.name,'text',true)+input('contractor','元請会社名',s.contractor)+'<p class="muted">名前を登録するだけでは、セコカン台帳の現場と連携しません。</p><button class="btn primary">下書き保存</button>',data=>{const saved={...Object.fromEntries(data),id:s.id||crypto.randomUUID()};const i=state.sites.findIndex(x=>x.id===saved.id);if(i<0)state.sites.push(saved);else state.sites[i]=saved;$('dialog').close();render();toast('現場の下書きを保存しました')})}
function exportForm(){if(!state.company){toast('先に会社情報を登録してください');return}if(!state.employees.length){toast('先に従業員を登録してください');return}openForm('名簿を作成・出力',`<label>提出先現場<select name="site"><option value="">現場指定なし</option>${state.sites.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label><h2>名簿に含める従業員</h2>${state.employees.map(e=>`<label class="check"><input type="checkbox" name="employees" value="${esc(e.id)}" checked>${esc(e.name)}</label>`).join('')}<label>出力形式<select name="format"><option value="csv">CSV（Excelで開けます）</option><option value="print">印刷 / PDF保存</option></select></label><p class="muted">基本名簿の試作出力です。元請指定様式への対応、直接提出、資格・健診ファイルの共有は未実装です。</p><button class="btn primary">選択した従業員で出力</button>`,data=>{const selected=new Set(data.getAll('employees'));const employees=state.employees.filter(e=>selected.has(e.id));if(!employees.length){toast('従業員を1名以上選んでください');return}const site=state.sites.find(s=>s.id===data.get('site'))?.name||'現場指定なし';if(data.get('format')==='csv')downloadCsv(employees,site);else printRoster(employees,site);state.history.unshift({date:localDate(),site,count:employees.length,type:data.get('format')==='csv'?'CSV出力':'印刷画面表示'});$('dialog').close();render()})}
function csvCell(value){let text=String(value??'');if(/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}
function downloadCsv(employees,site){const rows=[['会社名','現場名','氏名','ふりがな','職種','生年月日','保有資格','健診確認期限（社内設定）'],...employees.map(e=>[state.company.name,site,e.name,e.kana,e.trade,e.birthDate,e.qualification,e.healthDue])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='従業員名簿_'+localDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSVを出力しました。現場への送信は行っていません')}
function printRoster(employees,site){$('print').innerHTML=`<h1>従業員名簿（基本名簿）</h1><p>会社名：${esc(state.company.name)}　工事名称：${esc(site)}　作成日：${localDate()}</p><table><thead><tr><th>氏名</th><th>ふりがな</th><th>職種</th><th>生年月日</th><th>保有資格</th><th>健診確認期限（社内設定）</th></tr></thead><tbody>${employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.kana)}</td><td>${esc(e.trade)}</td><td>${esc(e.birthDate)}</td><td>${esc(e.qualification)}</td><td>${esc(e.healthDue)}</td></tr>`).join('')}</tbody></table><p>by セコカン台帳 ｜ 試作版・現場への送信なし</p>`;window.print()}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.page){state.page=button.dataset.page;render()}if(button.dataset.action){({company:companyForm,employee:employeeForm,site:siteForm,export:exportForm})[button.dataset.action]()}if(button.dataset.edit)employeeForm(button.dataset.edit);if(button.dataset.siteEdit)siteForm(button.dataset.siteEdit)});
document.addEventListener('input',event=>{if(event.target.id==='search'){const query=event.target.value.trim().toLocaleLowerCase();$('employees-table').innerHTML=employeeTable(state.employees.filter(e=>[e.name,e.trade,e.qualification].some(v=>(v||'').toLocaleLowerCase().includes(query))))}});
$('close').onclick=()=>$('dialog').close();render();
</script>
</body></html>
